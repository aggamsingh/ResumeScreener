# ══════════════════════════════════════════════════════════════
#  Resume Screener — Docker Compose
#
#  Services:
#    qdrant   → vector database (always running)
#    api      → FastAPI screening service (always running)
#    indexer  → one-shot CV indexer (run manually)
#
#  Commands:
#    Start service:    docker compose up -d
#    Index CVs:        docker compose run --rm indexer
#    Stop service:     docker compose down
#    View logs:        docker compose logs -f api
# ══════════════════════════════════════════════════════════════

services:

  # ── Qdrant Vector Database ────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: resume_screener_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST API — localhost only
      - "127.0.0.1:6334:6334"   # gRPC — localhost only
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true   # no phone-home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── FastAPI Screening API ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-screener:latest
    container_name: resume_screener_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override Qdrant host to use the Docker service name
      - QDRANT_HOST=qdrant
      # CV_FOLDER_PATH in .env is a HOST path (e.g. C:/HR/Resumes) and is used
      # as the bind-mount source below. Inside the container that path does not
      # exist — the mount always lands on /app/cvs, so override it here.
      - CV_FOLDER_PATH=/app/cvs
      # OCR for scanned PDFs — set to false in .env to disable
      - ENABLE_OCR=${ENABLE_OCR:-true}
    volumes:
      # CV files: the API both serves them (/api/v1/cvs) and writes to them
      # (SharePoint sync downloads here). Without this mount the API sees an
      # empty cvs/ folder and every downloaded resume dies with the container.
      - ${CV_FOLDER_PATH:-./cvs}:/app/cvs
      # State + embedded-Qdrant fallback. Must be writable: when the Qdrant
      # server is unreachable the API opens ./data/qdrant_db for writing.
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── CV Indexer (one-shot, manual) ─────────────────────────────
  # Run with:  docker compose run --rm indexer
  # Uses the same image as the api service.
  # Exits after indexing completes — not a persistent service.
  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-screener:latest
    container_name: resume_screener_indexer
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      # See the api service: the mount source is a host path, the mount target
      # is always /app/cvs. Without this override the indexer exits with
      # "CV folder not found" whenever CV_FOLDER_PATH is not ./cvs.
      - CV_FOLDER_PATH=/app/cvs
      - ENABLE_OCR=${ENABLE_OCR:-true}
    volumes:
      - ${CV_FOLDER_PATH:-./cvs}:/app/cvs:ro
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    command: python -m indexer.run
    profiles:
      - indexer   # excluded from "docker compose up" by default

# ── Named Volumes ─────────────────────────────────────────────
volumes:
  qdrant_data:
    name: resume_screener_qdrant_data
    # Qdrant data persists across container restarts and docker compose down.
    # To reset the database: docker volume rm resume_screener_qdrant_data
